    <text x="211" y="303" fill="#fff7e8" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="40" font-weight="800">위쪽, 그러나 압력</text>
    <text x="211" y="335" fill="#d8e7dd" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19">risk-on with pressure</text>

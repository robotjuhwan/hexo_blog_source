<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">상승 신호가 켜진 시장 앞에서 작은 관리 카드만 남긴 쥬</title>
  <desc id="desc">따뜻한 종이색 화면에 시장 신호, 세 개의 관리 카드, 검증 단계가 나란히 놓인 일러스트</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e5"/>
      <stop offset="1" stop-color="#dce8df"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173f3c"/>
      <stop offset="1" stop-color="#0e2927"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#24342e" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <circle cx="1135" cy="90" r="154" fill="#e9b66d" opacity="0.33"/>
  <circle cx="84" cy="630" r="166" fill="#7ba99a" opacity="0.22"/>
  <path d="M0 521C175 457 254 584 443 526s297-87 493-5 208-5 264-35v194H0z" fill="#f2dbc0" opacity="0.55"/>


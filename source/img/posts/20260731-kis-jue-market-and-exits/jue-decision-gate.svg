<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">시장 신호와 실제 실행을 분리하는 쥬의 결정 게이트</title>
  <desc id="desc">강한 시장 신호가 검증 게이트를 통과하지 못하면 신규 진입이 아니라 관찰로 끝나는 흐름도</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e7efe8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#42564e" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12z" fill="#3a675b"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="url(#paper)"/>
  <text x="600" y="89" text-anchor="middle" fill="#193f39" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="36" font-weight="800">시장이 좋다는 말은, 주문하라는 말이 아니다</text>
  <text x="600" y="124" text-anchor="middle" fill="#688077" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19">JUE는 시장 신호와 계좌 실행 사이에 세 개의 확인을 둔다</text>

  <g filter="url(#soft)">
    <rect x="80" y="220" width="270" height="232" rx="28" fill="#1d514b"/>
    <text x="115" y="268" fill="#a9d4be" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="700">01 / MARKET</text>
    <text x="115" y="326" fill="#fff8eb" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="800">위쪽 신호</text>
    <text x="115" y="365" fill="#d5e5da" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19">수급 · 프로그램 ·</text>
    <text x="115" y="394" fill="#d5e5da" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19">선도 섹터는 긍정적</text>

    <rect x="465" y="190" width="270" height="292" rx="28" fill="#e8b86d"/>
    <text x="500" y="238" fill="#65431e" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="700">02 / GATE</text>
    <text x="500" y="292" fill="#3f3422" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="800">검증은 충분한가</text>
    <circle cx="523" cy="341" r="9" fill="#3a675b"/>
    <text x="546" y="347" fill="#4f4128" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18">닫힌 표본 부족</text>
    <circle cx="523" cy="382" r="9" fill="#3a675b"/>
    <text x="546" y="388" fill="#4f4128" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18">환율 · 선물 압력</text>
    <circle cx="523" cy="423" r="9" fill="#3a675b"/>
    <text x="546" y="429" fill="#4f4128" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18">업종 속도 차이</text>

    <rect x="850" y="220" width="270" height="232" rx="28" fill="#d7e5da"/>
    <text x="885" y="268" fill="#547166" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="700">03 / ACTION</text>
    <text x="885" y="326" fill="#1e4a43" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="800">작게 관찰</text>
    <text x="885" y="365" fill="#46645a" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19">새 위험은 열지 않고</text>
    <text x="885" y="394" fill="#46645a" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19">기존 카드만 관리</text>
  </g>

  <path d="M360 336 H445" fill="none" stroke="#3a675b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M745 336 H830" fill="none" stroke="#3a675b" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(429 531)">
    <rect width="342" height="52" rx="26" fill="#1d514b"/>
    <text x="171" y="34" text-anchor="middle" fill="#fff8eb" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="800">비중 확대: 아직 보류</text>
  </g>
</svg>

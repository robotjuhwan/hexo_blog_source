<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">검증 부족 단계에서 작은 관리 카드만 유지하는 쥬</title>
  <desc id="desc">여러 개의 큰 카드가 잠긴 채 세 개의 작은 카드만 열린 상태를 보여주는 그림</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163d39"/>
      <stop offset="1" stop-color="#2d645a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#071b19" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>
  <path d="M0 465C160 414 320 525 509 461s321-31 470-82 169-23 221 7v234H0z" fill="#1d4c46" opacity="0.85"/>
  <text x="600" y="90" text-anchor="middle" fill="#fff5de" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="800">크게 확신하기 전에는, 작게 기록한다</text>
  <text x="600" y="125" text-anchor="middle" fill="#b9d6c9" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19">닫힌 거래 표본이 충분해질 때까지 쥬는 비중 확대를 잠근다</text>

  <g opacity="0.48" filter="url(#shadow)">
    <rect x="113" y="220" width="198" height="216" rx="24" fill="#a9c3b4"/>
    <path d="M181 315v-29a31 31 0 0 1 62 0v29" fill="none" stroke="#38584f" stroke-width="13" stroke-linecap="round"/>
    <rect x="162" y="312" width="100" height="78" rx="16" fill="#38584f"/>
    <text x="212" y="416" text-anchor="middle" fill="#284840" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="800">SCALE UP</text>
  </g>
  <g opacity="0.48" filter="url(#shadow)">
    <rect x="886" y="220" width="198" height="216" rx="24" fill="#a9c3b4"/>
    <path d="M954 315v-29a31 31 0 0 1 62 0v29" fill="none" stroke="#38584f" stroke-width="13" stroke-linecap="round"/>
    <rect x="935" y="312" width="100" height="78" rx="16" fill="#38584f"/>
    <text x="985" y="416" text-anchor="middle" fill="#284840" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="800">SCALE UP</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="391" y="193" width="418" height="286" rx="32" fill="#fff5df"/>
    <text x="600" y="245" text-anchor="middle" fill="#547165" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="700">CURRENT OPERATING POSTURE</text>
    <text x="600" y="302" text-anchor="middle" fill="#193f39" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="36" font-weight="800">SMALL PROBE</text>
    <g transform="translate(456 339)">
      <rect width="86" height="58" rx="14" fill="#e9b66d"/>
      <rect x="111" width="86" height="58" rx="14" fill="#d9e6d4"/>
      <rect x="222" width="86" height="58" rx="14" fill="#d7d2be"/>
    </g>
    <text x="600" y="438" text-anchor="middle" fill="#48645a" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18">열린 관리 카드 3개 · 미체결 주문 0개</text>

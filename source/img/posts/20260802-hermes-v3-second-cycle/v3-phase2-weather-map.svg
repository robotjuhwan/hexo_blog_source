  <text x="80" y="138" fill="#617875" font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif" font-size="22">예측 하나가 아니라, 판단 전에 확인할 세 가지 배경</text>
  <g font-family="Noto Sans KR, Apple SD Gothic Neo, sans-serif">

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">HERMES v3의 시장 날씨 지도</title>
  <desc id="desc">가격, 매크로, 리서치의 세 입력이 시장 상태를 설명하는 구조</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f0df"/><stop offset="1" stop-color="#e8dcc1"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#244f57"/><stop offset="1" stop-color="#16343d"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#456e70"/></marker>
  </defs>

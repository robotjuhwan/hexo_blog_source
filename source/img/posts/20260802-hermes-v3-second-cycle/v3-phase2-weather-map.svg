      <circle cx="47" cy="48" r="25" fill="#eab957"/><path d="M25 58c13-4 20-24 36-15 9 5 14 1 20-9" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linecap="round"/><circle cx="25" cy="58" r="4" fill="#fffaf0"/><circle cx="81" cy="34" r="4" fill="#fffaf0"/>
      <text x="31" y="112" fill="#244c50" font-size="30" font-weight="700">매크로</text>
      <text x="31" y="149" fill="#58706e" font-size="19">금리 · 달러 · VIX</text>
      <text x="31" y="180" fill="#58706e" font-size="19">1년 백분위 · 이월일수</text>
    </g>

      <circle cx="47" cy="48" r="25" fill="#71aaa2"/><path d="M32 30h30v35H32zM39 40h16M39 49h16M39 58h10" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linejoin="round"/>

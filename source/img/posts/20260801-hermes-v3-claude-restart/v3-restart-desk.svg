<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT를 해지하고 HERMES v3를 다시 시작하는 작업대</title>
  <desc id="desc">정리된 작업대 위에 v2 기록 상자, Claude 작업 카드, HERMES v3 청사진이 놓인 편집 일러스트</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0e6"/>
      <stop offset="1" stop-color="#d9e4e8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d59"/>
      <stop offset="1" stop-color="#0b2438"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1e3443" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="680" fill="url(#paper)"/>
  <path d="M0 486C148 427 290 543 477 484s338-68 515-18 164 3 208-22v236H0z" fill="#b9cfd7" opacity="0.58"/>
  <circle cx="1060" cy="90" r="168" fill="#e26f55" opacity="0.18"/>
  <circle cx="97" cy="99" r="109" fill="#5b9db7" opacity="0.14"/>

  <g filter="url(#shadow)">
    <rect x="146" y="123" width="908" height="418" rx="30" fill="url(#blue)"/>
    <rect x="146" y="123" width="908" height="54" rx="30" fill="#255b78"/>
    <circle cx="184" cy="150" r="8" fill="#e26f55"/>
    <circle cx="208" cy="150" r="8" fill="#f0c36d"/>
    <circle cx="232" cy="150" r="8" fill="#9bc7bd"/>
    <text x="274" y="156" fill="#e7f1f2" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="800">HERMES / RESTART NOTE</text>

    <rect x="194" y="220" width="246" height="245" rx="22" fill="#d9d4c7"/>
    <text x="225" y="266" fill="#536068" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="800">ARCHIVE</text>
    <text x="225" y="314" fill="#263b49" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="800">HERMES v2</text>
    <path d="M225 349h165M225 377h137M225 405h151" stroke="#85949a" stroke-width="10" stroke-linecap="round"/>
    <text x="225" y="443" fill="#6c7678" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">keep the evidence</text>

    <path d="M460 341 H560" fill="none" stroke="#e26f55" stroke-width="10" stroke-linecap="round"/>
    <path d="M548 327 L579 341 L548 355" fill="none" stroke="#e26f55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="595" y="205" width="405" height="275" rx="24" fill="#f5f0e4"/>
    <text x="634" y="251" fill="#3d6d85" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="800">NEW WORKSPACE</text>
    <text x="634" y="306" fill="#183c56" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="40" font-weight="800">HERMES v3</text>
    <rect x="634" y="334" width="138" height="43" rx="21" fill="#e26f55"/>
    <text x="703" y="362" text-anchor="middle" fill="#fff8ef" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="800">CLAUDE</text>
    <path d="M634 408 H934" stroke="#9db5bd" stroke-width="3" stroke-dasharray="9 10"/>
    <text x="634" y="444" fill="#58707a" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18">모델보다 먼저, 구조를 다시 세운다</text>
  </g>

  <g transform="translate(368 581)">
    <rect width="464" height="56" rx="28" fill="#e26f55"/>
    <text x="232" y="37" text-anchor="middle" fill="#fff9f1" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="800">새 구독이 아니라, 새 기준으로 시작</text>
  </g>
</svg>

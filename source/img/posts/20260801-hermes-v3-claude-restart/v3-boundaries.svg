<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">HERMES v3의 명시적 경계와 검증 게이트</title>
  <desc id="desc">데이터와 로컬 분석, LLM 판단, 검증 게이트, 실행이 순서대로 분리된 구조도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ed"/>
      <stop offset="1" stop-color="#e0e9ef"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#355568" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12z" fill="#3d6d85"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <text x="600" y="82" text-anchor="middle" fill="#183c56" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="800">v3는 판단을 더 많이 시키지 않는다</text>
  <text x="600" y="118" text-anchor="middle" fill="#69808c" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19">재현 가능한 분석과 검증 게이트를 먼저 두고, LLM은 필요한 순간에만 쓴다</text>

  <g filter="url(#soft)">
    <rect x="64" y="237" width="190" height="214" rx="24" fill="#d8e7eb"/>
    <text x="159" y="282" text-anchor="middle" fill="#557a8d" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="800">01 / DATA</text>
    <text x="159" y="338" text-anchor="middle" fill="#183c56" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="800">시장 데이터</text>
    <text x="159" y="374" text-anchor="middle" fill="#54717e" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">시점이 남는</text>
    <text x="159" y="400" text-anchor="middle" fill="#54717e" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">원본 기록</text>

    <rect x="299" y="237" width="190" height="214" rx="24" fill="#b7d5d0"/>
    <text x="394" y="282" text-anchor="middle" fill="#3f716a" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="800">02 / LOCAL</text>
    <text x="394" y="338" text-anchor="middle" fill="#164c48" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="800">알파 엔진</text>
    <text x="394" y="374" text-anchor="middle" fill="#416961" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">같은 입력이면</text>
    <text x="394" y="400" text-anchor="middle" fill="#416961" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">같은 분석</text>

    <rect x="534" y="237" width="190" height="214" rx="24" fill="#f1c272"/>
    <text x="629" y="282" text-anchor="middle" fill="#896127" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="800">03 / JUDGMENT</text>
    <text x="629" y="338" text-anchor="middle" fill="#5d4219" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="800">Claude</text>
    <text x="629" y="374" text-anchor="middle" fill="#74592e" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">이벤트가 있을 때</text>
    <text x="629" y="400" text-anchor="middle" fill="#74592e" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">포트폴리오 판단</text>

    <rect x="769" y="217" width="190" height="254" rx="24" fill="#e37259"/>
    <text x="864" y="262" text-anchor="middle" fill="#fff0e5" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="800">04 / GATE</text>
    <text x="864" y="318" text-anchor="middle" fill="#fff8ef" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="800">검증 통과</text>
    <text x="864" y="355" text-anchor="middle" fill="#fff0e5" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">표본 · 비용 ·</text>
    <text x="864" y="382" text-anchor="middle" fill="#fff0e5" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">워크포워드 확인</text>
    <rect x="806" y="410" width="116" height="29" rx="14" fill="#a74438"/>
    <text x="864" y="431" text-anchor="middle" fill="#fff8ef" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="800">NO BYPASS</text>

    <rect x="1004" y="237" width="132" height="214" rx="24" fill="#244f68"/>
    <text x="1070" y="282" text-anchor="middle" fill="#c9e1e9" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="800">05</text>
    <text x="1070" y="338" text-anchor="middle" fill="#fff8ec" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="800">실행</text>
    <text x="1070" y="374" text-anchor="middle" fill="#c9e1e9" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">안전 규칙</text>
    <text x="1070" y="400" text-anchor="middle" fill="#c9e1e9" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16">멱등성</text>
  </g>

  <path d="M261 344 H282 M496 344 H517 M731 344 H752 M966 344 H987" fill="none" stroke="#3d6d85" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(353 547)">
    <rect width="494" height="54" rx="27" fill="#183c56"/>
    <text x="247" y="35" text-anchor="middle" fill="#f7f4e9" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="800">검증되지 않은 신호는 실거래로 가지 않는다</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">HERMES v3 현재 상태</title>
  <desc id="desc">한국 주식과 미국 주식, 코인 시장을 관찰하고 판단을 기록하지만 주문은 잠겨 있는 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5ecd8"/><stop offset="1" stop-color="#d8e5da"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#29594f"/><stop offset="1" stop-color="#173d3a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#315249" flood-opacity=".23"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#d88559"/></marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <path d="M0 618 C210 540 332 718 540 625 S902 548 1200 630 V720 H0Z" fill="#c8d9c8" opacity=".8"/>
  <text x="74" y="91" fill="#193e3c" font-family="Georgia, serif" font-size="46" font-weight="700">지금의 HERMES v3</text>
  <text x="76" y="133" fill="#56736c" font-family="sans-serif" font-size="23">시장을 보고 · 이유를 기록하고 · 주문은 아직 잠가 둔다</text>
  <g filter="url(#shadow)">
    <rect x="70" y="220" width="238" height="236" rx="28" fill="#fffaf0"/>
    <rect x="373" y="220" width="238" height="236" rx="28" fill="#fffaf0"/>
    <rect x="676" y="220" width="238" height="236" rx="28" fill="#fffaf0"/>
    <rect x="979" y="220" width="156" height="236" rx="28" fill="url(#dark)"/>
  </g>
  <g fill="none" stroke="#d88559" stroke-width="7" marker-end="url(#arrow)">
    <path d="M318 338 H355"/><path d="M621 338 H658"/><path d="M924 338 H961"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="189" y="278" fill="#1c4e49" font-size="25" font-weight="700">1. 시장 보기</text>
    <text x="189" y="320" fill="#49716a" font-size="19">한국 · 미국 · 코인</text>
    <g transform="translate(115 351)"><rect width="148" height="48" rx="24" fill="#d8e9e2"/><circle cx="34" cy="24" r="13" fill="#d88559"/><circle cx="74" cy="24" r="13" fill="#e1b85d"/><circle cx="114" cy="24" r="13" fill="#70a9a0"/></g>
    <text x="492" y="278" fill="#1c4e49" font-size="25" font-weight="700">2. 이유 고르기</text>
    <text x="492" y="320" fill="#49716a" font-size="19">할 일이 있나?</text>
    <path d="M452 365 h80" fill="none" stroke="#47736a" stroke-width="4"/><path d="M452 389 h56" fill="none" stroke="#47736a" stroke-width="4"/><circle cx="546" cy="376" r="19" fill="#e1b85d"/><path d="M537 376 l7 7 13-16" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="795" y="278" fill="#1c4e49" font-size="25" font-weight="700">3. 판단 기록</text>
    <text x="795" y="320" fill="#49716a" font-size="19">관찰 장부에 남김</text>
    <rect x="747" y="352" width="96" height="63" rx="7" fill="#d8e9e2"/><path d="M766 370 h57 M766 387 h42 M766 404 h50" stroke="#47736a" stroke-width="4" stroke-linecap="round"/>
    <text x="1057" y="278" fill="#fff7e8" font-size="24" font-weight="700">4. 주문</text>
    <text x="1057" y="319" fill="#b8d5c6" font-size="18">아직 없음</text>
    <path d="M1021 382 v-21a36 36 0 0 1 72 0v21" fill="none" stroke="#f1c167" stroke-width="12" stroke-linecap="round"/>
    <rect x="1013" y="382" width="88" height="61" rx="10" fill="#f1c167"/><circle cx="1057" cy="409" r="7" fill="#173d3a"/>
  </g>
  <rect x="72" y="530" width="1062" height="114" rx="24" fill="#fffaf0" opacity=".95"/>
  <g font-family="sans-serif">
    <text x="108" y="577" fill="#193e3c" font-size="27" font-weight="700">현재 위치</text>
    <text x="108" y="617" fill="#54746c" font-size="22">관찰은 상시로, 백테스트는 더 엄격하게, 주문 권한은 아직 0.</text>
  </g>
  <circle cx="1058" cy="588" r="24" fill="#d88559"/><path d="M1047 588 l8 8 17-20" fill="none" stroke="#fffaf0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
